services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      firestore:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/api/tags || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      jwt-signing-config: "HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms"
